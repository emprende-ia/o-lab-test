# Mantiene GitHub Pages al día: en cada push a la rama de trabajo,
# espeja el contenido en la rama gh-pages (fuente del sitio).
name: Desplegar a GitHub Pages

on:
  push:
    branches: [claude/olab-editor-mockup-tomzy2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar en la rama gh-pages
        run: git push --force origin HEAD:gh-pages
